[versions]
kotlin = "2.4.20"
serialization = "1.11.0"
junit = "6.1.2"
agp = "9.4.1"
composeBom = "2026.09.00"
wearCompose = "1.7.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
healthServices = "1.1.0"
wearOngoing = "1.1.0"
wear = "1.4.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
coroutines = "1.11.0"
# 워치 앱 실행 코루틴은 1.9.0(지도 SDK가 없어 올라가지 않는다). 테스트 라이브러리를 1.11로 두면 계측 테스트가 NoSuchMethodError
coroutinesWear = "1.9.0"
playServicesLocation = "21.4.0"
coreKtx = "1.19.1"
navigationCompose = "2.10.2"
mapsCompose = "9.0.1"
playServicesMaps = "20.1.0"
espresso = "3.7.0"

[libraries]
# androidx.wear:wear 1.4.0이 fragment 1.2.4를 끌어와 lintVitalRelease(InvalidFragmentVersionForActivityResult)가 실패한다 → 1.3 이상으로 올린다
fragment = { module = "androidx.fragment:fragment", version = "1.8.9" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
health-services-client = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
wear = { module = "androidx.wear:wear", version.ref = "wear" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutines-test-wear = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesWear" }
# 폰 앱(:mobile). Material 3·아이콘은 Compose BOM이 버전을 정한다
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espresso" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
